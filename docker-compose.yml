name: gitsync

services:
  gitsync:
    build: .
    image: gitsync:latest
    container_name: gitsync
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/database          # Database storage
      - ./backups:/backups             # Backup repositories
      - ./docker_ssh:/root/.ssh        # SSH keys (mapped to local docker_ssh folder)
    environment:
      - DATABASE_URL=sqlite:////app/database/git_backup.db
      - ENCRYPT_KEY=${ENCRYPT_KEY:-your_secret_key_here}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
